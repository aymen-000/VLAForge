site_name: VLAForge
site_description: A modular Python framework for Vision-Language-Action models
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    scheme: default
    primary: white
    accent: grey
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Installation: installation.md
  - Datasets: datasets.md
  - Training: training.md
  - Inference and evaluation: inference.md
  - API reference: api.md
  - Contributing: contributing.md
  - License: license.md
  - Documentation website: website.md
